name: Promote to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag semver opcional (ex: v1.2.0) — vazio = apenas atualiza :stable'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pkd

permissions:
  contents: read
  packages: write

jobs:
  promote:
    name: Re-tag edge → stable + semver
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve source image and version tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "src=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:edge" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "src=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-tag as stable (+ semver if provided)
        run: |
          SRC="${{ steps.vars.outputs.src }}"
          VER="${{ steps.vars.outputs.version }}"
          EXTRA_TAG=""
          if [ -n "${VER}" ]; then
            EXTRA_TAG="--tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VER}"
          fi
          docker buildx imagetools create \
            ${EXTRA_TAG} \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable" \
            "${SRC}"

      - name: Summary
        run: |
          VER="${{ steps.vars.outputs.version }}"
          echo "## Promoted to production" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source | \`${{ steps.vars.outputs.src }}\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${VER}" ]; then
            echo "| Version | \`${VER}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| Stable | \`:stable\` updated |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull on EC2: \`docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable\`" >> "$GITHUB_STEP_SUMMARY"
