<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PKD — Unlock</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: system-ui, sans-serif;
    }
    .login-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 16px rgba(0,0,0,.12);
      padding: 2.5rem 2rem;
      width: min(360px, 90vw);
    }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; letter-spacing: -.5px; }
    label { display: block; font-size: .875rem; margin-bottom: .25rem; color: #555; }
    input[type=password] {
      width: 100%;
      padding: .6rem .75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    input[type=password]:focus { outline: 2px solid #4f46e5; border-color: transparent; }
    button[type=submit] {
      width: 100%;
      padding: .65rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    button[type=submit]:hover { background: #4338ca; }
    #error-msg { color: #dc2626; font-size: .875rem; margin-top: .75rem; text-align: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>🔒 PKD</h1>
    <form id="login-form">
      <label for="password">Master password</label>
      <input id="password" type="password" name="password" autofocus autocomplete="current-password" required>
      <button type="submit">Unlock</button>
      <p id="error-msg" aria-live="polite"></p>
    </form>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const errMsg = document.getElementById('error-msg');
    const csrfCookie = document.cookie.split(';')
      .map(c => c.trim())
      .find(c => c.startsWith('pkd_csrf='));
    const csrfToken = csrfCookie ? csrfCookie.split('=')[1] : '';

    form.addEventListener('submit', async e => {
      e.preventDefault();
      errMsg.textContent = '';
      const password = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-Token': csrfToken,
        },
        body: JSON.stringify({ password }),
      });
      if (res.ok) {
        window.location.replace('/');
      } else if (res.status === 429) {
        errMsg.textContent = 'Too many failed attempts. Please wait 30 minutes.';
      } else {
        errMsg.textContent = 'Incorrect password.';
      }
    });
  </script>
</body>
</html>
