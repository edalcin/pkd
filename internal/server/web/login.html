<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PKD — Entrar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: system-ui, sans-serif;
    }
    .login-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 16px rgba(0,0,0,.12);
      padding: 2.5rem 2rem;
      width: min(360px, 90vw);
    }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; letter-spacing: -.5px; }
    label { display: block; font-size: .875rem; margin-bottom: .25rem; color: #555; }
    input[type=password] {
      width: 100%;
      padding: .6rem .75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    input[type=password]:focus { outline: 2px solid #4f46e5; border-color: transparent; }
    button[type=submit] {
      width: 100%;
      padding: .65rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    button[type=submit]:hover { background: #4338ca; }
    #error-msg { color: #dc2626; font-size: .875rem; margin-top: .75rem; text-align: center; min-height: 1.25rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>🔒 PKD</h1>
    <!--
      method="post" garante que, mesmo se o JS falhar, a senha não apareça
      na URL (GET exporia a senha no histórico do browser e em logs de servidor).
      O script login.js intercepta o submit via fetch (JSON + CSRF token).
    -->
    <form id="login-form" method="post" action="/api/login">
      <label for="password">Senha mestra</label>
      <input id="password" type="password" name="password"
             autofocus autocomplete="current-password" required>
      <button type="submit">Entrar</button>
      <p id="error-msg" role="alert" aria-live="polite"></p>
    </form>
  </div>
  <!-- Arquivo externo — permitido pelo CSP (script-src 'self').
       Scripts inline são bloqueados pelo CSP sem 'unsafe-inline'. -->
  <script src="/js/login.js"></script>
</body>
</html>
