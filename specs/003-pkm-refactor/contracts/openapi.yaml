openapi: '3.0.3'
info:
  title: PKD — Personal Knowledge Management API
  version: '0.2.0'
  description: |
    API for the PKM refactor (003-pkm-refactor).
    Extends the 001 API with bidirectional links, graph data, and content capture.

servers:
  - url: /

security:
  - sessionCookie: []
    csrfHeader: []

paths:
  # ── Auth ────────────────────────────────────────────────
  /api/login:
    post:
      summary: Authenticate with master password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '204': { description: Login successful, session cookie set }
        '401': { description: Wrong password }
        '429': { description: Too many failed attempts }

  /api/logout:
    post:
      summary: End session
      responses:
        '204': { description: Logged out }

  # ── Documents ───────────────────────────────────────────
  /api/documents:
    post:
      summary: Create document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id: { type: integer, nullable: true }
                title: { type: string, default: Untitled }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }

  /api/documents/{id}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      summary: Get document by ID
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { description: Not found }
    put:
      summary: Update document (with version check)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, title, body_html]
              properties:
                version: { type: integer }
                title: { type: string }
                body_html: { type: string }
                body_text: { type: string }
                icon: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '409':
          description: Version conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConflict' }
    delete:
      summary: Soft-delete document (move to trash)
      responses:
        '204': { description: Moved to trash }
        '404': { description: Not found }

  /api/documents/{id}/move:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      summary: Move document to new parent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                new_parent_id: { type: integer, nullable: true }
      responses:
        '204': { description: Moved }
        '400': { description: Circular move not allowed }

  /api/documents/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      summary: Restore document from trash
      responses:
        '204': { description: Restored }
        '404': { description: Not found in trash }

  # ── Links (NEW) ─────────────────────────────────────────
  /api/documents/{id}/links:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      summary: List outgoing links and incoming backlinks
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  outgoing:
                    type: array
                    items: { $ref: '#/components/schemas/LinkEntry' }
                  incoming:
                    type: array
                    items: { $ref: '#/components/schemas/LinkEntry' }
    post:
      summary: Create link from this document to target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id]
              properties:
                target_id: { type: integer }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkEntry' }
        '409': { description: Link already exists }

  /api/documents/{id}/links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - name: linkId
        in: path
        required: true
        schema: { type: integer }
    delete:
      summary: Remove link
      responses:
        '204': { description: Link removed }
        '404': { description: Link not found }

  # ── Graph (NEW) ─────────────────────────────────────────
  /api/graph:
    get:
      summary: "Get graph data (nodes + edges) for D3.js visualization"
      parameters:
        - name: tag
          in: query
          schema: { type: string }
          description: Filter by tag name (optional, can repeat for AND)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        title: { type: string }
                        icon: { type: string }
                        tags: { type: array, items: { type: string } }
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        source: { type: integer }
                        target: { type: integer }

  # ── Capture (NEW) ───────────────────────────────────────
  /api/capture:
    post:
      summary: Capture external content as a new document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                content: { type: string }
                url: { type: string, format: uri }
                tags: { type: array, items: { type: string } }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }

  # ── Tree ────────────────────────────────────────────────
  /api/tree:
    get:
      summary: Get document tree (hierarchical)
      parameters:
        - name: tag
          in: query
          schema: { type: string }
          description: Filter by tag (AND semantics, repeatable)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentTreeNode' }

  # ── Tags ────────────────────────────────────────────────
  /api/tags:
    get:
      summary: List all tags with document counts
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TagWithCount' }

  /api/documents/{id}/tags:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    put:
      summary: Replace document tags
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tags: { type: array, items: { type: string } }
      responses:
        '204': { description: Tags updated }

  # ── Search ──────────────────────────────────────────────
  /api/search:
    get:
      summary: Universal search
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SearchHit' }
        '400': { description: Empty query }

  # ── Calendar ────────────────────────────────────────────
  /api/calendar/{year}/{month}:
    get:
      summary: Documents by creation date for a month
      parameters:
        - name: year
          in: path
          required: true
          schema: { type: integer }
        - name: month
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    day: { type: integer }
                    documents:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { type: integer }
                          title: { type: string }
                          icon: { type: string }

  # ── Attachments ─────────────────────────────────────────
  /api/documents/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      summary: Upload attachment
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '413': { description: File too large }

  /api/attachments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Download attachment
      responses:
        '200': { description: File stream }
    delete:
      summary: Delete attachment
      responses:
        '204': { description: Deleted }

  # ── Share ───────────────────────────────────────────────
  /api/documents/{id}/shares:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      summary: Create share link
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  url: { type: string }
                  revoke_id: { type: integer }

  /api/documents/{id}/shares/{shareId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - name: shareId
        in: path
        required: true
        schema: { type: integer }
    delete:
      summary: Revoke share link
      responses:
        '204': { description: Revoked }

  /public/{token}:
    get:
      summary: View shared document (public, no auth)
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: HTML page with document content }
        '404': { description: Not found or revoked }

  # ── Admin ───────────────────────────────────────────────
  /api/admin/backup:
    post:
      summary: Download database backup
      responses:
        '200': { description: SQLite file download }

  /api/admin/restore:
    post:
      summary: Restore database from backup
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                confirm: { type: string, enum: [REPLACE] }
      responses:
        '204': { description: Restored }
        '400': { description: "Invalid file or missing confirmation" }

  /api/admin/cleanup:
    post:
      summary: Remove orphaned attachments and VACUUM
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  orphans_removed: { type: integer }

  /api/admin/tags/rename:
    put:
      summary: Rename or merge tag
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [old, new]
              properties:
                old: { type: string }
                new: { type: string }
      responses:
        '204': { description: Tag renamed/merged }

  /api/admin/trash:
    get:
      summary: List trashed documents
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }

  /api/admin/trash/{id}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    delete:
      summary: Permanently delete one trashed document
      responses:
        '204': { description: Permanently deleted }

  /api/admin/trash/empty:
    post:
      summary: Permanently delete all trashed documents
      responses:
        '204': { description: Trash emptied }

  # ── Health & PWA ────────────────────────────────────────
  /healthz:
    get:
      summary: Health check
      security: []
      responses:
        '200': { description: Alive }

  /manifest.webmanifest:
    get:
      summary: PWA manifest
      security: []
      responses:
        '200': { description: Web manifest JSON }

  /sw.js:
    get:
      summary: Service worker
      security: []
      responses:
        '200': { description: Service worker JS }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pkd_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token

  parameters:
    DocumentId:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64 }

  schemas:
    Document:
      type: object
      properties:
        id: { type: integer }
        parent_id: { type: integer, nullable: true }
        title: { type: string }
        body_html: { type: string }
        body_text: { type: string }
        icon: { type: string }
        position: { type: integer }
        version: { type: integer }
        trashed_at: { type: string, format: date-time, nullable: true }
        tags: { type: array, items: { type: string } }
        attachment_ids: { type: array, items: { type: integer } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DocumentTreeNode:
      type: object
      properties:
        id: { type: integer }
        parent_id: { type: integer, nullable: true }
        title: { type: string }
        icon: { type: string }
        position: { type: integer }
        version: { type: integer }
        tags: { type: array, items: { type: string } }
        children:
          type: array
          items: { $ref: '#/components/schemas/DocumentTreeNode' }

    VersionConflict:
      type: object
      properties:
        stored_version: { type: integer }
        stored: { $ref: '#/components/schemas/Document' }

    LinkEntry:
      type: object
      properties:
        id: { type: integer }
        source_id: { type: integer }
        target_id: { type: integer }
        source_title: { type: string }
        target_title: { type: string }
        target_trashed: { type: boolean }
        created_at: { type: string, format: date-time }

    SearchHit:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        snippet: { type: string }

    TagWithCount:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        count: { type: integer }

    Attachment:
      type: object
      properties:
        id: { type: integer }
        document_id: { type: integer }
        original_name: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        url: { type: string }
        created_at: { type: string, format: date-time }
